name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On main a run finishes: a release waits for a green run, and one cancelled
# by every next push left none to wait for (LESSONS.md). A newer push still
# replaces a run that hasn't started. A PR's run is cancelled by its next push.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}${{ matrix.part && format(', {0}', matrix.part) || '' }})
    strategy:
      fail-fast: false
      # macOS runs in four parts at once: the packages but the gateway in
      # three shares (build/pkg-shards.sh), and the gateway as its own part;
      # the race detector's steps run in the race job beside this one. In one
      # job it took ~93 minutes on a 3-core runner, and its Test step met the
      # 75m cap with no test failing (#6903): the cap was set when that step
      # took 31. Ubuntu and Windows run whole.
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - {os: macos-latest, part: '1/3'}
          - {os: macos-latest, part: '2/3'}
          - {os: macos-latest, part: '3/3'}
          - {os: macos-latest, part: gateway}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The GUI links GTK 3 and WebKitGTK 4.1 through cgo on Linux (see the
      # Makefile), so vet and test need their headers and the gtk3 tag.
      # A stuck apt mirror held main's run here for 2.5 hours (b0d456c3), and
      # every later push queued behind it; it takes under a minute.
      - name: Install GTK and WebKitGTK
        if: runner.os == 'Linux'
        # bounded tries within 18 minutes, taking turns with Ubuntu's own archive
        # (v0.2.36's Release: a slow mirror ran out the 15 minutes)
        timeout-minutes: 25
        run: scripts/ci-apt.sh libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Tags
        id: tags
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then echo "tags=gtk3" >> "$GITHUB_OUTPUT"; fi

      # Unformatted files reached main 8 times from 10-01 to 10-06 and each
      # took a gofmt commit of its own. Linux only: Windows checks out CRLF.
      - name: Gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # shellcheck disable=SC2046 # one Go file per word
          bad=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$bad" ]; then echo "not gofmt'd:"; echo "$bad"; exit 1; fi

      - name: Vet
        if: matrix.part == '' || matrix.part == '1/3'
        run: go vet -tags "${{ steps.tags.outputs.tags }}" ./...

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # A step cap: on 0dbdc7481's macOS run internal/library printed
      # nothing for 44 minutes past go test's own -timeout 30m (no panic, no
      # stack, #5267), and main's later runs queued behind it until it was
      # cancelled by hand. A share of macOS's packages takes ~20 minutes, and
      # ubuntu's whole run ~11.
      - name: Test
        if: runner.os != 'Windows' && matrix.part != 'gateway'
        timeout-minutes: 45
        shell: bash
        env:
          PART: ${{ matrix.part }}
        run: |
          go list -tags "${{ steps.tags.outputs.tags }}" ./... | grep -v '/internal/gateway$' |
            if [ -n "$PART" ]; then build/pkg-shards.sh "${PART%/*}" "${PART#*/}"; else cat; fi |
            xargs go test -timeout 30m -tags "${{ steps.tags.outputs.tags }}"

      # internal/gateway's tests run one at a time (t.Setenv rules out
      # t.Parallel): 892s on mote for 4286 tests on 11-15, none over 20s,
      # 965s on macOS CI, and past the 30m alarm on f1c9014cd with no test
      # hung (#2191). It grew from 450-600s on 10-28, so a longer timeout
      # would only be met again. Its plain run goes in chunks, one process
      # per core, as the race job's Race step does.
      - name: Gateway
        if: runner.os != 'Windows' && (matrix.part == '' || matrix.part == 'gateway')
        timeout-minutes: 30
        shell: bash
        run: |
          go test -c -o "$RUNNER_TEMP/gateway.test" -tags "${{ steps.tags.outputs.tags }}" ./internal/gateway/
          build/race-shards.sh internal/gateway "$RUNNER_TEMP/gateway.test" "$(getconf _NPROCESSORS_ONLN)" -test.timeout=20m

      # Windows skips the Test step above, so the two plugin stderr tests run
      # here. The end-to-end one needs bun on PATH; without it it skips.
      - name: Plugin stderr tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bun --version
          go test -v -count=1 ./internal/plugin/ -run '^(TestHostStartsPastAnOverlongStderrLine|TestDrainStderrKeepsTheChildGoing)$'

      - name: Production plugin flow
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          OWL_FLOW_BIG: '1'
        run: |
          bun --version
          go test -timeout 10m -tags "${{ steps.tags.outputs.tags }}" ./internal/plugin/... -run '^TestFlowBigReplyProd$' -count=1

      # Some tests fake a home through $HOME, which Windows doesn't read
      # (USERPROFILE), or assume Unix file modes. Compile the full suite
      # on Windows and run the isolated native checks below.
      - name: Compile tests
        if: runner.os == 'Windows'
        run: go test -run '^$' ./...

      # These checks use in-memory errors and loopback test servers. Run
      # the native Winsock refusal case rather than only compiling it.
      - name: Windows MCP health
        if: runner.os == 'Windows'
        run: go test -v -count=1 -timeout 2m ./internal/library -run '^(TestNetHealth|TestCheckHTTP)$'

      # The gateway asks Windows who owns a loopback connection's socket
      # (peeruid), so another user's process isn't answered as this one's.
      # That read is native: run it here, not only compile it.
      - name: Windows peer identity
        if: runner.os == 'Windows'
        run: go test -v -count=1 -timeout 2m ./internal/gateway/peeruid -run '^TestSameOwnConnection$'

      # Usage isolates USERPROFILE and the agent homes; execute its native
      # ChangeTime checks rather than only cross-compiling the Windows API.
      - name: Windows usage cache
        if: runner.os == 'Windows'
        run: go test -v -count=1 ./internal/usage -run '^(TestWindows|TestLogChange|TestLogFileInfoPreservesIdentity$|TestUsageSameSizeAndMtimeRewrite$|TestLogGrowingRewriteThenAppend$|TestUsagePageCacheAfterUncachedQuery$)'

      # Install tests keep their files in t.TempDir; exercise real Windows
      # executable and held-handle rename/rollback behavior, and the trial
      # start before the install (#2272).
      - name: Windows update install
        if: runner.os == 'Windows'
        run: go test -v -count=1 -timeout 2m ./internal/update -run '^(TestInstallBinary|TestMoveAside|TestTrialStart)'

      # These tests use temporary paths, without the Unix HOME assumptions
      # of the full suite. Run the native link-kind and sharing-error checks,
      # and the Codex copy checks that read NTFS ChangeTime (#1299).
      - name: Windows session moves
        if: runner.os == 'Windows'
        run: go test -v -count=1 ./internal/sessions -run '^Test(WindowsSession|Move|CopyAll|CodexArchived|CodexSameTick|CodexPlainTwin)'

      # dsh's layered config is read and edited in temporary homes. Run
      # these checks on Windows too, including Desktop's home patch layer.
      - name: Windows dsh configuration
        if: runner.os == 'Windows'
        run: go test -v -count=1 ./internal/agent -run '^Test(Dsh|KeepDsh)'

      - name: Windows VS Code detection
        if: runner.os == 'Windows'
        run: go test -v -count=1 ./internal/agent -run '^TestVSCodeDetected$'

  # The race detector's runs used to follow Test in the same job, so a
  # macOS run was 22m of Test and 19m of Race one after the other (43m
  # wall). They are their own job, side by side with Test: the same
  # minutes, half the wall, and this repository's runs are public and free.
  race:
    name: race (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install GTK and WebKitGTK
        if: runner.os == 'Linux'
        # bounded tries within 18 minutes, taking turns with Ubuntu's own archive
        # (v0.2.36's Release: a slow mirror ran out the 15 minutes)
        timeout-minutes: 25
        run: scripts/ci-apt.sh libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Tags
        id: tags
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then echo "tags=gtk3" >> "$GITHUB_OUTPUT"; fi

      # The redaction tests reuse this binary in fresh processes to check
      # first-use races, so it must include the race detector. The gateway's
      # tests can't call t.Parallel (t.Setenv), so its suite runs split over
      # one process per core (#923); each process isolates its own home.
      # A shard gets 45m, the time LESSONS gives the package: under -race a
      # 3-core macOS runner ran its share past 20m (run 41933329344) with
      # nothing wrong, its heaviest tests being 40 MB and 516 MB turns.
      - name: Race
        shell: bash
        run: |
          go test -race -c -o "$RUNNER_TEMP/gateway.race" -tags "${{ steps.tags.outputs.tags }}" ./internal/gateway/
          build/race-shards.sh internal/gateway "$RUNNER_TEMP/gateway.race" "$(getconf _NPROCESSORS_ONLN)" -test.timeout=45m
          go test -race -tags "${{ steps.tags.outputs.tags }}" ./internal/redact/

      # Account usage mixes cached results with concurrent fetches.
      - name: Race account usage
        run: go test -race -tags "${{ steps.tags.outputs.tags }}" ./internal/provider/ -run '^Test(LoginUsage|SubscriptionUsageEachAccount)'

  cli:
    name: cli (${{ matrix.goos }}/${{ matrix.goarch }}, nogui)
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: android
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the terminal-only release
        env:
          CGO_ENABLED: '0'
        run: make release-cli TARGETS="${{ matrix.goos }}/${{ matrix.goarch }}"
      - uses: actions/setup-node@v4
        if: matrix.goos == 'linux'
        with:
          node-version: 22
      # The installer and the credits page are still used; the Cloudflare
      # worker that served the old site is not deployed for this fork,
      # which updates and installs from GitHub Releases (worker.test.mjs
      # and stable.test.mjs cover it, and are left as they are).
      - name: Test the site and installer
        if: matrix.goos == 'linux'
        run: |
          sh -n site/public/install.sh
          node --test site/install.test.mjs site/credits.test.mjs
